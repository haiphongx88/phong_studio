    <style>
        :root {
            --accent: #ff6600; 
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* FIXED: Vibrant blue studio gradient to melt away the image borders */
        body {
            background: radial-gradient(circle at center, #1E3A8A 0%, #0F172A 40%, #020617 100%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- NAVIGATION --- */
        nav { 
            padding: 20px 40px; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--border);
            background: rgba(2, 6, 23, 0.75);
        }
        .logo a { color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono'; font-weight: 800; text-transform: uppercase; font-size: 18px; letter-spacing: 2px; }
        
        .nav-right { display: flex; align-items: center; gap: 25px; }
        .nav-link { color: white; text-decoration: none; font-size: 0.75rem; font-family: 'JetBrains Mono'; letter-spacing: 1px; transition: 0.3s; }
        .nav-link:hover { color: var(--accent); }

        /* --- FIXED CONTAINER (Transparent to show the gradient) --- */
        .showcase-container {
            width: 100%;
            margin-top: 140px; 
            padding: 0 20px 80px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px; 
            background: transparent; 
        }

        /* FIXED: Closed the box-shadow correctly so the rendering engine executes the imagery */
        .showcase-img {
            width: 100%;
            max-width: 1100px; 
            height: auto;
            display: block;
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* --- RESPONSIVE FIXES FOR PHONE SCREENS --- */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-right { gap: 15px; }
            .nav-link { font-size: 0.65rem; }
            .showcase-container { margin-top: 100px; gap: 30px; padding: 0 15px 40px; }
            .showcase-img { border-radius: 6px; }
        }
